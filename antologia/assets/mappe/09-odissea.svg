<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1120" viewBox="0 0 1440 1120" role="img" aria-labelledby="title desc"><title id="title">Odissea: ritrovare la strada, ritrovare sé</title><desc id="desc">Odissea: il ritorno e l’identità. Odissea: il ritorno e l’identità parte da L’assenza. A Itaca Telemaco cerca notizie e i Proci occupano la casa. L’assenza apre La Telemachia. I primi quattro libri seguono soprattutto il figlio. Odissea: il ritorno e l’identità intreccia Il viaggio raccontato. Presso i Feaci Odisseo rievoca le avventure precedenti. Il viaggio raccontato costruisce L’analessi IX–XII. Il passato diventa racconto dentro il presente del poema. Odissea: il ritorno e l’identità raggiunge Itaca ritrovata. Alleati, lotta e riconoscimenti ricostruiscono la casa. Itaca ritrovata richiede La pace finale. Atena arresta la vendetta dei parenti dei Proci.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a25e31"/></marker></defs><rect width="1440" height="1120" fill="#f5ead2"/><rect x="24" y="24" width="1392" height="1072" rx="9" fill="none" stroke="#a57c45" stroke-width="2"/><path d="M55 52h32v-16h-22v8h12" fill="none" stroke="#ad7844" stroke-width="2"/><path d="M55 1064h32v-16h-22v8h12" fill="none" stroke="#ad7844" stroke-width="2"/><path d="M99 52h32v-16h-22v8h12" fill="none" stroke="#ad7844" stroke-width="2"/><path d="M99 1064h32v-16h-22v8h12" fill="none" stroke="#ad7844" stroke-width="2"/><path d="M143 52h32v-16h-22v8h12" fill="none" stroke="#ad7844" stroke-width="2"/><path d="M143 1064h32v-16h-22v8h12" fill="none" stroke="#ad7844" stroke-width="2"/><path d="M187 52h32v-16h-22v8h12" fill="none" stroke="#ad7844" stroke-width="2"/><path d="M187 1064h32v-16h-22v8h12" fill="none" stroke="#ad7844" stroke-width="2"/><path d="M231 52h32v-16h-22v8h12" fill="none" stroke="#ad7844" stroke-width="2"/><path d="M231 1064h32v-16h-22v8h12" fill=
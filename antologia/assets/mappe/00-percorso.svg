<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1120" viewBox="0 0 1440 1120" role="img" aria-labelledby="title desc"><title id="title">Racconti, miti e scelte: il percorso</title><desc id="desc">Racconti, miti e scelte. Racconti, miti e scelte imparare a Narrare. 01–02 · Racconto, media e funzioni del mito. Narrare apre domande sul Comunicare. C1 · Modelli, stereotipi e responsabilità. Racconti, miti e scelte permette di Leggere il limite. 03–05 · Hybris, Edipo e Antigone. Leggere il limite si confronta con Prove e dissenso. C2–C3 · Giudizio, leggi e argomentazione. Racconti, miti e scelte aiuta a discutere Scegliere e tornare. 06–10 · Troia, eroi e narrazione visiva. Scegliere e tornare interroga Conflitto e identità. C4–C5 · Umanità, ospitalità, riconoscimento.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a25e31"/></marker></defs><rect width="1440" height="1120" fill="#f5ead2"/><rect x="24" y="24" width="1392" height="1072" rx="9" fill="none" stroke="#a57c45" stroke-width="2"/><path d="M55 52h32v-16h-22v8h12" fill="none" stroke="#ad7844" stroke-width="2"/><path d="M55 1064h32v-16h-22v8h12" fill="none" stroke="#ad7844" stroke-width="2"/><path d="M99 52h32v-16h-22v8h12" fill="none" stroke="#ad7844" stroke-width="2"/><path d="M99 1064h32v-16h-22v8h12" fill="none" stroke="#ad7844" stroke-width="2"/><path d="M143 52h32v-16h-22v8h12" fill="none" stroke="#ad7844" stroke-width="2"/><path d="M143 1064h32v-16h-22v8h12" fill="none" stroke="#ad7844" stroke-width="2"/><path d="M187 52h32v-16h-22v8h12" fill="none" stroke="#ad7844" stroke-width="2"/><path d="M187 1064h32v-16h-22v8h12" fill="none" stroke="#ad7844" stroke-width="2"/><path d="M231 52h32v-16h-22v8h12" fill="none" stroke="#ad7844" stroke-width="2"/><path d="M231 1064h32v-16h-22v8h12" fill="none" stroke="#ad7844" stroke-width="2"/><path d="M275 52h32v-16h-22v8h12" fill="none" stroke
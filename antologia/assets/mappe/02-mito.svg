<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1120" viewBox="0 0 1440 1120" role="img" aria-labelledby="title desc"><title id="title">Il mito dà un ordine al mondo</title><desc id="desc">Il mito. Il mito racconta le Origini. Cosmogonia e teogonia raccontano la formazione del mondo divino. Origini si rappresentano con Genealogie. Le relazioni “genera” distinguono le discendenze. Il mito interroga il Potere. La successione Urano–Crono–Zeus mette in scena conflitti. Potere dipende da Azioni e alleanze. Gea, Rea e gli alleati rendono possibili i cambiamenti. Il mito coinvolge la Comunità. Il piacere del racconto intreccia apprendimento, identità e riti. Comunità si esprime con Immagini e simboli. Gli attributi rendono riconoscibili figure e relazioni.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a25e31"/></marker></defs><rect width="1440" height="1120" fill="#f5ead2"/><rect x="24" y="24" width="1392" height="1072" rx="9" fill="none" stroke="#a57c45" stroke-width="2"/><path d="M55 52h32v-16h-22v8h12" fill="none" stroke="#ad7844" stroke-width="2"/><path d="M55 1064h32v-16h-22v8h12" fill="none" stroke="#ad7844" stroke-width="2"/><path d="M99 52h32v-16h-22v8h12" fill="none" stroke="#ad7844" stroke-width="2"/><path d="M99 1064h32v-16h-22v8h12" fill="none" stroke="#ad7844" stroke-width="2"/><path d="M143 52h32v-16h-22v8h12" fill="none" stroke="#ad7844" stroke-width="2"/><path d="M143 1064h32v-16h-22v8h12" fill="none" stroke="#ad7844" stroke-width="2"/><path d="M187 52h32v-16h-22v8h12" fill="none" stroke="#ad7844" stroke-width="2"/><path d="M187 1064h32v-16h-22v8h12" fill="none" stroke="#ad7844" stroke-width="2"/><path d="M231 52h32v-16h-22v8h12" fill="none" stroke="#ad7844" stroke-width="2"/><path d="M231 1064h32v-16h-22v8h12" fill="none" stroke="#ad7844" stroke-width="2"/><path d="M275 52h32v-16h-22v8h12" fill="none" stroke="#ad7844" stro
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1120" viewBox="0 0 1440 1120" role="img" aria-labelledby="title desc"><title id="title">Appartenere: chi può raccontare chi sei?</title><desc id="desc">Entrare in una comunità. Entrare in una comunità richiede Accoglienza. Offre aiuto e rende comprensibili spazi, regole e strumenti. Accoglienza può aprire alla Partecipazione. Permette di contribuire attraverso possibilità e ruoli concreti. Entrare in una comunità incontra Identità. Comprende aspetti diversi e non si esaurisce in un’etichetta. Identità trova voce nell’ Autorappresentazione. Dà forma agli aspetti di sé che una persona vuole condividere. Entrare in una comunità costruisce Riconoscimento. Dà spazio alla voce e al contributo della persona. Riconoscimento sostiene l’ Appartenenza plurale. Si può partecipare a più gruppi mantenendo differenze personali.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a25e31"/></marker></defs><rect width="1440" height="1120" fill="#f5ead2"/><rect x="24" y="24" width="1392" height="1072" rx="9" fill="none" stroke="#a57c45" stroke-width="2"/><path d="M55 52h32v-16h-22v8h12" fill="none" stroke="#ad7844" stroke-width="2"/><path d="M55 1064h32v-16h-22v8h12" fill="none" stroke="#ad7844" stroke-width="2"/><path d="M99 52h32v-16h-22v8h12" fill="none" stroke="#ad7844" stroke-width="2"/><path d="M99 1064h32v-16h-22v8h12" fill="none" stroke="#ad7844" stroke-width="2"/><path d="M143 52h32v-16h-22v8h12" fill="none" stroke="#ad7844" stroke-width="2"/><path d="M143 1064h32v-16h-22v8h12" fill="none" stroke="#ad7844" stroke-width="2"/><path d="M187 52h32v-16h-22v8h12" fill="none" stroke="#ad7844" stroke-width="2"/><path d="M187 1064h32v-16h-22v8h12" fill="none" stroke="#ad7844" stroke-width="2"/><path d="M231 52h32v-16h-22v8h12" fill="none" stroke="#ad7844" stroke-width="2"/><path d="M231 1064h32v-16h-22v8h12" f
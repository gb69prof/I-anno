<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1120" viewBox="0 0 1440 1120" role="img" aria-labelledby="title desc"><title id="title">Raccontare e scegliere</title><desc id="desc">Raccontare e scegliere. Raccontare e scegliere richiede di Leggere e confrontare. Desideri, ostacoli e conseguenze rendono precisi i confronti. Leggere e confrontare cerca Le prove nel testo. Ogni interpretazione richiama un episodio e un dettaglio. Raccontare e scegliere permette di Progettare una scena. Gesti, oggetti e inquadrature rendono concreto il conflitto. Progettare una scena costruisce Lo storyboard. Sei scene organizzano una storia visiva originale. Raccontare e scegliere si completa con Motivare e revisionare. La lettura di un altro rivela informazioni mancanti o confuse. Motivare e revisionare migliora Una consegna leggibile. Tavola, descrizione equivalente e nota spiegano il progetto.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a25e31"/></marker></defs><rect width="1440" height="1120" fill="#f5ead2"/><rect x="24" y="24" width="1392" height="1072" rx="9" fill="none" stroke="#a57c45" stroke-width="2"/><path d="M55 52h32v-16h-22v8h12" fill="none" stroke="#ad7844" stroke-width="2"/><path d="M55 1064h32v-16h-22v8h12" fill="none" stroke="#ad7844" stroke-width="2"/><path d="M99 52h32v-16h-22v8h12" fill="none" stroke="#ad7844" stroke-width="2"/><path d="M99 1064h32v-16h-22v8h12" fill="none" stroke="#ad7844" stroke-width="2"/><path d="M143 52h32v-16h-22v8h12" fill="none" stroke="#ad7844" stroke-width="2"/><path d="M143 1064h32v-16h-22v8h12" fill="none" stroke="#ad7844" stroke-width="2"/><path d="M187 52h32v-16h-22v8h12" fill="none" stroke="#ad7844" stroke-width="2"/><path d="M187 1064h32v-16h-22v8h12" fill="none" stroke="#ad7844" stroke-width="2"/><path d="M231 52h32v-16h-22v8h12" fill="none" stroke="#ad7844" stroke-width="2"/><path d="M231 1064h
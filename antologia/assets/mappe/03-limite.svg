hor="middle" fill="#0b2e47" font-family="DejaVu Serif, Georgia, serif" font-size="28" font-weight="bold"><tspan x="720" dy="0">Icaro</tspan></text><text x="720" y="896" text-anchor="middle" fill="#172b36" font-family="DejaVu Serif, Georgia, serif" font-size="24"><tspan x="720" dy="0">Le ali permettono la fuga</tspan><tspan x="720" dy="33.599999999999994">ma restano fragili.</tspan></text><path d="M720 300 V342 H1180 V438" fill="none" stroke="#a25e31" stroke-width="3" marker-end="url(#arrow)"/><rect x="980" y="358" width="400" height="51" rx="20" fill="#f5ead2"/><text x="1180" y="390" text-anchor="middle" fill="#7d3728" font-family="DejaVu Serif, Georgia, serif" font-size="25"><tspan x="1180" dy="0">emerge dalle</tspan></text><rect x="980" y="450" width="400" height="204" rx="9" fill="#fff9eb" stroke="#8a392b" stroke-width="2"/><rect x="980" y="450" width="400" height="8" rx="3" fill="#8a392b"/><text x="1180" y="500" text-anchor="middle" fill="#78372a" font-family="DejaVu Serif, Georgia, serif" font-size="29" font-weight="bold"><tspan x="1180" dy="0">Conseguenze</tspan></text><text x="1180" y="544" text-anchor="middle" fill="#172b36" font-family="DejaVu Serif, Georgia, serif" font-size="24"><tspan x="1180" dy="0">Ogni nesso va ricostruito</tspan><tspan x="1180" dy="33.599999999999994">nel singolo racconto.</tspan></text><path d="M1180 657 V789" fill="none" stroke="#a25e31" stroke-width="3" marker-end="url(#arrow)"/><rect x="983" y="688" width="394" height="64" rx="22" fill="#f5ead2"/><text x="1180" y="726" text-anchor="middle" fill="#7d3728" font-family="DejaVu Serif, Georgia, serif" font-size="24"><tspan x="1180" dy="0">richiedono</tspan></text><rect x="980" y="800" width="400" height="204" rx="9" fill="#e9d3b5" stroke="#b08a59" stroke-width="2"/><text x="1180" y="849" text-anchor="middle" fill="#0b2e47" font-family="DejaVu Serif, Georgia, serif" font-size="28" font-weight="bold"><tspan x="1180" dy="0">Giudizio</tspan></text><text x="1180" y="896" text-anchor="middle" fill="#172b36" font-family="DejaVu Serif, Georgia, serif" font-size="24"><tspan x="1180" dy="0">Sofferenza e colpa non</tspan><tspan x="1180" dy="33.599999999999994">coincidono</tspan><tspan x="1180" dy="33.599999999999994">automaticamente.</tspan></text></svg>
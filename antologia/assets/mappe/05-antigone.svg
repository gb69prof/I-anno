<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1120" viewBox="0 0 1440 1120" role="img" aria-labelledby="title desc"><title id="title">Antigone davanti al decreto</title><desc id="desc">Il conflitto di Antigone. Il conflitto di Antigone mette alla prova il Decreto di Creonte. La sicurezza della città giustifica, per il re, il divieto funebre. Decreto di Creonte incontra Antigone risponde. Il dovere religioso verso il fratello prevale sul bando. Il conflitto di Antigone si confronta con le Voci della città. Ismene, Emone e Tiresia introducono ragioni e avvertimenti. Voci della città richiedono Ascolto e correzione. Il comando può riconoscere un errore e cambiare. Il conflitto di Antigone conduce a Conseguenze. La decisione viene corretta quando la tragedia è già avvenuta. Conseguenze impongono Responsabilità. Creonte riconosce il costo delle proprie scelte.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a25e31"/></marker></defs><rect width="1440" height="1120" fill="#f5ead2"/><rect x="24" y="24" width="1392" height="1072" rx="9" fill="none" stroke="#a57c45" stroke-width="2"/><path d="M55 52h32v-16h-22v8h12" fill="none" stroke="#ad7844" stroke-width="2"/><path d="M55 1064h32v-16h-22v8h12" fill="none" stroke="#ad7844" stroke-width="2"/><path d="M99 52h32v-16h-22v8h12" fill="none" stroke="#ad7844" stroke-width="2"/><path d="M99 1064h32v-16h-22v8h12" fill="none" stroke="#ad7844" stroke-width="2"/><path d="M143 52h32v-16h-22v8h12" fill="none" stroke="#ad7844" stroke-width="2"/><path d="M143 1064h32v-16h-22v8h12" fill="none" stroke="#ad7844" stroke-width="2"/><path d="M187 52h32v-16h-22v8h12" fill="none" stroke="#ad7844" stroke-width="2"/><path d="M187 1064h32v-16h-22v8h12" fill="none" stroke="#ad7844" stroke-width="2"/><path d="M231 52h32v-16h-22v8h12" fill="none" stroke="#ad7844" stroke-width="2"/><path d="M231 1064h32v-16h-22v8h12" fill
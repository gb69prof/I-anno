<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1120" viewBox="0 0 1440 1120" role="img" aria-labelledby="title desc"><title id="title">Iliade: dall’ira alla pietà</title><desc id="desc">Iliade: dall’ira alla pietà. Iliade: dall’ira alla pietà si apre con La rottura. L’offesa di Agamennone provoca il ritiro di Achille. La rottura espone Gli Achei in pericolo. Le divisioni interne si uniscono alla pressione dei Troiani. Iliade: dall’ira alla pietà attraversa Il lutto. La morte di Patroclo muove Achille alla vendetta. Il lutto conduce alla La morte di Ettore. La vittoria non restituisce l’amico né placa il dolore. Iliade: dall’ira alla pietà approda alla La supplica. Priamo richiama il ricordo di Peleo e chiede il figlio. La supplica rende possibili I funerali di Ettore. Il corpo torna a Troia: qui il poema si conclude.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a25e31"/></marker></defs><rect width="1440" height="1120" fill="#f5ead2"/><rect x="24" y="24" width="1392" height="1072" rx="9" fill="none" stroke="#a57c45" stroke-width="2"/><path d="M55 52h32v-16h-22v8h12" fill="none" stroke="#ad7844" stroke-width="2"/><path d="M55 1064h32v-16h-22v8h12" fill="none" stroke="#ad7844" stroke-width="2"/><path d="M99 52h32v-16h-22v8h12" fill="none" stroke="#ad7844" stroke-width="2"/><path d="M99 1064h32v-16h-22v8h12" fill="none" stroke="#ad7844" stroke-width="2"/><path d="M143 52h32v-16h-22v8h12" fill="none" stroke="#ad7844" stroke-width="2"/><path d="M143 1064h32v-16h-22v8h12" fill="none" stroke="#ad7844" stroke-width="2"/><path d="M187 52h32v-16h-22v8h12" fill="none" stroke="#ad7844" stroke-width="2"/><path d="M187 1064h32v-16h-22v8h12" fill="none" stroke="#ad7844" stroke-width="2"/><path d="M231 52h32v-16h-22v8h12" fill="none" stroke="#ad7844" stroke-width="2"/><path d="M231 1064h32v-16h-22v8h12" fill="none" stroke="#ad7844" stroke-width="2
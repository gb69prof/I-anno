<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1120" viewBox="0 0 1440 1120" role="img" aria-labelledby="title desc"><title id="title">Paride: da una scelta alla guerra</title><desc id="desc">Paride: dal desiderio al conflitto. Paride: dal desiderio al conflitto nasce da La contesa. Eris introduce un premio conteso da tre dee. La contesa si trasforma in Le promesse. Potere, sapienza e vittoria, amore orientano il giudizio. Paride: dal desiderio al conflitto si concentra su La scelta. Paride assegna la mela ad Afrodite. La scelta si collega a Elena a Troia. Le tradizioni divergono sul modo della partenza. Paride: dal desiderio al conflitto conduce alla La spedizione. Menelao invoca aiuto e giuramento; Agamennone riunisce i capi. La spedizione costituisce un Antefatto iliadico. La guerra precede l’inizio del poema sull’ira di Achille.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a25e31"/></marker></defs><rect width="1440" height="1120" fill="#f5ead2"/><rect x="24" y="24" width="1392" height="1072" rx="9" fill="none" stroke="#a57c45" stroke-width="2"/><path d="M55 52h32v-16h-22v8h12" fill="none" stroke="#ad7844" stroke-width="2"/><path d="M55 1064h32v-16h-22v8h12" fill="none" stroke="#ad7844" stroke-width="2"/><path d="M99 52h32v-16h-22v8h12" fill="none" stroke="#ad7844" stroke-width="2"/><path d="M99 1064h32v-16h-22v8h12" fill="none" stroke="#ad7844" stroke-width="2"/><path d="M143 52h32v-16h-22v8h12" fill="none" stroke="#ad7844" stroke-width="2"/><path d="M143 1064h32v-16h-22v8h12" fill="none" stroke="#ad7844" stroke-width="2"/><path d="M187 52h32v-16h-22v8h12" fill="none" stroke="#ad7844" stroke-width="2"/><path d="M187 1064h32v-16h-22v8h12" fill="none" stroke="#ad7844" stroke-width="2"/><path d="M231 52h32v-16h-22v8h12" fill="none" stroke="#ad7844" stroke-width="2"/><path d="M231 1064h32v-16h-22v8h12" fill="none" stroke="#ad7844"
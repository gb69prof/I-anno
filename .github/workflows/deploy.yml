name: Sincronizza I-anno sul server

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-i-anno
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Aggiorna I-anno tramite SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 3m
          script: |
            set -eu

            repo=/opt/gbprof/projects/I-anno
            web=/opt/gbprof/www/I-anno

            test -d "$repo/.git"
            test -L "$web"
            test "$(readlink -f "$web")" = "$(readlink -f "$repo")"

            cd "$repo"
            test "$(git remote get-url origin)" = "https://github.com/gb69prof/I-anno.git"
            test -z "$(git status --porcelain=v1)"

            git fetch --prune origin main
            git merge --ff-only origin/main

            test -z "$(git status --porcelain=v1)"
            test "$(curl -sS -o /dev/null -w '%{http_code}' https://gbprof.it/I-anno/Lezioni/Miti/)" = "200"
            test "$(curl -sS -o /dev/null -w '%{http_code}' https://gbprof.it/I-anno/antologia/)" = "200"
            test "$(curl -sS -o /dev/null -w '%{http_code}' https://gbprof.it/I-anno/.git/config)" = "404"

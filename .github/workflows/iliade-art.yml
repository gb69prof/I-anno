name: Prepara immagini Iliade
on:
  push:
    branches: [main]
    paths:
      - 'Lezioni/Idiade-Odissea/tools/prepare-iliade-art.py'
      - 'Lezioni/Idiade-Odissea/data/iliade-art-sources.json'
      - '.github/workflows/iliade-art.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: iliade-art
  cancel-in-progress: false

jobs:
  generate-art:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installa Pillow
        run: python -m pip install 'Pillow>=11,<13'
      - name: Scarica e adatta le dieci opere
        run: |
          cd Lezioni/Idiade-Odissea
          python tools/prepare-iliade-art.py
      - name: Pubblica file WebP nel repository
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "gbprof-automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Lezioni/Idiade-Odissea/assets/images/iliade-timeline/
          if ! git diff --cached --quiet; then
            git commit -m "assets(iliade): dieci scene pittoriche webp locali"
            git push origin HEAD:main
          fi

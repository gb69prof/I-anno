name: Libro illustrato dell'Iliade
on:
  push:
    branches: [main]
    paths:
      - 'Lezioni/Idiade-Odissea/tools/build_iliade_book.py'
      - 'Lezioni/Idiade-Odissea/data/iliade-otto-tappe.json'
      - 'Lezioni/Idiade-Odissea/assets/images/iliade-otto-fumetto/**'
      - '.github/workflows/iliade-libro.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  impagina:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Scarica il progetto
        uses: actions/checkout@v4
      - name: Prepara Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installa le dipendenze
        run: python -m pip install --disable-pip-version-check reportlab Pillow PyMuPDF
      - name: Genera il volume A4
        run: python Lezioni/Idiade-Odissea/tools/build_iliade_book.py
      - name: Controlla testo, figure e paginazione
        shell: bash
        run: |
          python - <<'PY'
          import json, fitz
          from pathlib import Path
          root=Path('Lezioni/Idiade-Odissea')
          data=json.loads((root/'data/iliade-otto-tappe.json').read_text(encoding='utf8'))
          book=fitz.open(root/'fatto/iliade-libro-illustrato.pdf')
          assert len(book)==27, f'Pagine: {len(book)}; attese 27'
          full='\n'.join(page.get_text() for page in book)
          for i,event in enumerate(data['events']):
              for para in event['paragraphs']:
                  sample=' '.join(para.split())[:48]
                  assert sample[:25] in ' '.join(full.split()), f'Brano {i+1} non trovato: {sample}'
              assert len(book[2+i*3].get_images())>=1, f'Illustrazione assente al capitolo {i+1}'
          assert sum(len(p.get_images()) for p in book) >=25, 'Immagini troppo poche'
          assert 'SCHEMA DI SINTESI' in full and 'DOMANDE PER METTERSI ALLA PROVA' in full
          size=(root/'fatto/iliade-libro-illustrato.pdf').stat().st_size
          assert size<7_000_000, f'Il PDF non è ottimizzato: {size} byte'
          page=book[2]
          pix=page.get_pixmap(matrix=fitz.Matrix(1.5,1.5),alpha=False)
          pix.save(str(root/'fatto/iliade-libro-anteprima.png'))
          print(f'PDF ottimizzato: {size/1_000_000:.2f} MB')
          print(f'Verificato: {len(book)} pagine, otto capitoli, tutte le scene, tavole e domande.')
          PY
      - name: Allega il libro scaricabile al collaudo
        uses: actions/upload-artifact@v4
        with:
          name: iliade-libro-illustrato
          path: Lezioni/Idiade-Odissea/fatto/iliade-libro-illustrato.pdf
          retention-days: 7
          if-no-files-found: error
      - name: Pubblica il PDF nel repository
        shell: bash
        run: |
          git config user.name "gbprof-book-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Lezioni/Idiade-Odissea/fatto/iliade-libro-illustrato.pdf Lezioni/Idiade-Odissea/fatto/iliade-libro-anteprima.png
          if ! git diff --cached --quiet; then
            git commit -m "Impaginazione: aggiorna libro illustrato dell'Iliade"
            git push
          fi

name: Collaudo Micene 3D
on:
  push:
    branches: [main]
    paths:
      - 'Storia/Cnosso-Micene/**'
      - '.github/workflows/test-micene.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Installazione test browser
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Avvio sito
        run: python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/micene-server.log 2>&1 &
      - name: Smoke test WebGL
        run: node Storia/Cnosso-Micene/smoke.cjs
      - name: Salva schermata del collaudo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: micene-smoke-screenshot
          path: micene-3d-smoke.png
          if-no-files-found: ignore
